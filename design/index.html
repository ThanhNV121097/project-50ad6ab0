<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hello-word</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #000000;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100vh;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <main aria-label="Hello Word message">
    <h1>Hello Word</h1>
  </main>
</body>
</html>
